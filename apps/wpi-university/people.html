<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People · WPI University</title>
<meta name="description" content="Invite, assign and manage every rep on the platform.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WPI U">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
<script>try{var t=localStorage.getItem('wpi-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-page="people">
<a class="skip-link" href="#main">Skip to content</a>
<div id="shell"></div>
<main id="main">

<section class="wrap wrap-wide">
  <div class="page-head">
    <nav class="crumbs enter" aria-label="Breadcrumb">
      <a href="index.html">Dashboard</a><span data-icon="chevron"></span>
      <span aria-current="page">People</span>
    </nav>
    <div class="row-between">
      <div class="enter" style="--enter-delay:60ms">
        <h1 class="h1">People</h1>
        <p class="lede" style="margin-top:8px">Everyone with access to WPI University, and how far along they are.</p>
      </div>
      <div class="row gap-sm enter" style="--enter-delay:120ms">
        <button class="btn btn-secondary" data-export>Export CSV</button>
        <a class="btn btn-primary" href="invite.html">Invite a rep</a>
      </div>
    </div>
  </div>

  <div id="rosterNotice" style="margin-top:16px"></div>
  <div class="grid grid-4" style="margin-top:20px" data-stagger="60" id="peopleStats"></div>

  <div class="card card-pad-sm enter" style="--enter-delay:180ms;margin-top:24px">
    <div class="row-between toolbar-row" style="gap:12px">
      <div class="search-field" style="flex:1 1 240px;max-width:340px">
        <span data-icon="search"></span>
        <input class="input" id="peopleSearch" type="search" placeholder="Search name, email or team…" aria-label="Search people">
      </div>
      <div class="segmented" id="statusFilter" role="tablist" aria-label="Filter by status">
        <button role="tab" data-status="" aria-selected="true">All</button>
        <button role="tab" data-status="active" aria-selected="false">Active</button>
        <button role="tab" data-status="assigned" aria-selected="false">Assigned</button>
        <button role="tab" data-status="pending" aria-selected="false">Invite pending</button>
        <button role="tab" data-status="none" aria-selected="false">No training</button>
      </div>
      <select class="select" id="teamFilter" aria-label="Filter by sales team" style="width:auto;min-width:180px"></select>
    </div>
  </div>

  <p class="small faint" id="peopleCount" style="margin-top:16px" aria-live="polite"></p>

  <div class="panel" style="margin-top:12px;margin-bottom:32px" data-reveal>
    <div class="table-scroll">
      <table class="table">
        <thead>
          <tr>
            <th>Rep</th><th>Sales team</th><th>Role</th>
            <th style="min-width:170px">Training progress</th>
            <th class="num">Lessons done</th><th>Last activity</th><th></th>
          </tr>
        </thead>
        <tbody id="peopleRows"></tbody>
      </table>
    </div>
  </div>
</section>

</main>
<div id="shellFooter"></div>

<script src="assets/js/data.js"></script>
<!-- Optional: generated by tools/extract-roster.py, never committed. -->
<script src="assets/js/roster.js" onerror="void 0"></script>
<script>
window.pageInit = function () {
  var D = window.WPI, A = window.App, esc = A.esc;
  var state = { q: A.param('q') || '', status: '', team: '' };

  /* The real roster comes from assets/js/roster.js, generated out of the site
     archive by tools/extract-roster.py. That file holds personal data about
     real people, so it is not committed — when it is absent the page falls
     back to the seeded demo set and says so. */
  var roster = window.WPI_ROSTER || null;
  var people = roster ? roster.people : D.people;
  var teams  = roster ? roster.teams  : D.teams;

  document.getElementById('rosterNotice').innerHTML = roster
    ? '<span class="chip chip-green">' + App.icon('check') + 'Live roster · ' +
        roster.totals.people.toLocaleString() + ' people from the site archive</span>'
    : '<div class="card card-pad-sm" style="border-color:rgba(var(--blue-rgb),.3)">' +
        '<div class="row" style="align-items:flex-start;gap:12px">' +
          '<span class="pi-icon" data-icon="users"></span>' +
          '<div><div class="h4">Showing demo data</div>' +
          '<p class="small muted" style="margin-top:4px">' +
            'The real roster is not in the repository. Generate it from your archive with ' +
            '<code class="key">python3 tools/extract-roster.py path/to/wpiuniversity.com</code> ' +
            'and reload — this page picks it up automatically.</p></div>' +
        '</div></div>';

  var counts = {
    all: people.length,
    active: people.filter(function (p) { return p.status === 'active'; }).length,
    pending: people.filter(function (p) { return p.status === 'pending'; }).length,
    admins: people.filter(function (p) { return p.admin; }).length
  };
  /* Averaged over people who actually have training assigned — folding in
     rows with nothing assigned would drag the figure down meaninglessly. */
  var withWork = people.filter(function (p) { return (p.lessonsAssigned || p.lessons30) > 0; });
  var avg = withWork.length
    ? Math.round(withWork.reduce(function (a, p) { return a + p.progress; }, 0) / withWork.length)
    : 0;

  document.getElementById('peopleStats').innerHTML = [
    ['users',  'blue',  counts.all,     'On the platform',  ''],
    ['check',  'green', counts.active,  'With training activity', ''],
    ['mail',   'mint',  counts.pending, 'Invitations pending', ''],
    ['award',  'navy',  avg,            'Average progress', '%']
  ].map(function (s) {
    return '<div class="card card-hover" data-reveal>' +
        '<span class="tile tile-' + s[1] + '" data-icon="' + s[0] + '"></span>' +
        '<div class="stat" style="margin-top:14px">' +
          '<span class="stat-value" style="font-size:2rem" data-count="' + s[2] + '"' +
            (s[4] ? ' data-count-suffix="' + s[4] + '"' : '') + '>0</span>' +
          '<span class="stat-label">' + esc(s[3]) + '</span>' +
        '</div></div>';
  }).join('');

  var teamSel = document.getElementById('teamFilter');
  teamSel.innerHTML = '<option value="">All sales teams</option>' +
    teams.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');

  var STATUS = {
    active:   ['chip-green', 'Active'],
    assigned: ['chip-blue',  'Assigned'],
    pending:  ['',           'Invite pending'],
    none:     ['',           'No training'],
    unknown:  ['',           'Not captured'],
    invited:  ['chip-blue',  'Invited'],
    paused:   ['',           'Paused']
  };

  /* The demo set and the extracted roster carry different fields; both are read
     through here so the table markup only has to know about one shape. */
  function day(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-US',
      { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function view(p) {
    var last = 'No activity';
    if (p.last) last = day(p.last);
    else if (p.invitedAt) last = 'Invited ' + day(p.invitedAt);
    else if (p.lastSeen) last = p.lastSeen;

    return {
      id: p.id,
      name: p.name || '—',
      email: p.email || '',
      team: p.team,
      admin: p.admin,
      pending: !!p.pending,
      status: p.status,
      progress: p.progress,
      done: p.lessonsComplete != null ? p.lessonsComplete : p.lessons30,
      total: p.lessonsAssigned != null ? p.lessonsAssigned : null,
      last: last
    };
  }

  /* 3,700 rows at once is a scroll the browser should not have to lay out. */
  var PAGE = 100;
  var shown = PAGE;

  function render(resetPage) {
    if (resetPage !== false) shown = PAGE;
    var q = state.q.trim().toLowerCase();
    var list = people.filter(function (p) {
      if (state.status && p.status !== state.status) return false;
      if (state.team && p.team !== state.team) return false;
      if (!q) return true;
      return (p.name + ' ' + p.email + ' ' + (p.team || '') + ' ' + (p.username || ''))
        .toLowerCase().indexOf(q) >= 0;
    });

    document.getElementById('peopleCount').textContent =
      list.length.toLocaleString() + (list.length === 1 ? ' person' : ' people') +
      (q ? ' matching “' + state.q.trim() + '”' : '') +
      (state.team ? ' in ' + state.team : '') +
      (list.length > shown ? ' · showing the first ' + shown : '');

    var body = document.getElementById('peopleRows');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="7"><div class="empty">' +
        '<span class="tile tile-blue" data-icon="users"></span>' +
        '<div class="h3">Nobody matches those filters</div>' +
        '<p class="small muted">Widen the search or pick a different team.</p></div></td></tr>';
      A.refresh();
      return;
    }

    body.innerHTML = list.slice(0, shown).map(function (raw) {
      var p = view(raw);
      var initials = p.name.split(' ').filter(Boolean)
        .map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
      var st = STATUS[p.status] || STATUS.invited;
      return '<tr>' +
        '<td><div class="row" style="gap:11px">' +
            '<span class="avatar" style="cursor:default">' + esc(initials) + '</span>' +
            '<span style="min-width:0"><span class="strong" style="display:block">' + esc(p.name) + '</span>' +
            '<span class="tiny faint truncate" style="display:block">' + esc(p.email) + '</span></span>' +
          '</div></td>' +
        '<td>' + (p.team
            ? '<a class="small" href="teams.html">' + esc(p.team) + '</a>'
            : '<span class="tiny faint">None</span>') + '</td>' +
        '<td>' + (p.admin
            ? '<span class="chip chip-navy">Admin</span>'
            : '<span class="chip ' + st[0] + '">' + st[1] + '</span>') + '</td>' +
        '<td>' + (p.pending
            ? '<span class="tiny faint">Not accepted yet</span>'
            : '<div class="row gap-sm">' +
                '<div class="bar thin" style="flex:1;min-width:80px"><i data-grow="' + p.progress + '"></i></div>' +
                '<span class="tiny numeric faint" style="width:32px">' + p.progress + '%</span>' +
              '</div>') + '</td>' +
        '<td class="num numeric">' + (p.pending ? '<span class="tiny faint">—</span>' : p.done +
          (p.total ? '<span class="tiny faint"> / ' + p.total + '</span>' : '')) + '</td>' +
        '<td class="small muted">' + esc(p.last) + '</td>' +
        '<td class="num">' + (p.pending
            ? '<span class="tiny faint">—</span>'
            : '<a class="btn btn-ghost btn-sm" href="profile.html?u=' + p.id + '">Details</a>') + '</td>' +
      '</tr>';
    }).join('') + (list.length > shown
      ? '<tr><td colspan="7" style="text-align:center;padding:18px">' +
          '<button class="btn btn-secondary btn-sm" data-more>Show ' +
            Math.min(PAGE, list.length - shown) + ' more · ' +
            (list.length - shown).toLocaleString() + ' remaining</button></td></tr>'
      : '');
    A.refresh();
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-more]')) { shown += PAGE; render(false); }
  });

  var input = document.getElementById('peopleSearch');
  input.value = state.q;
  input.addEventListener('input', function () { state.q = input.value; render(); });

  document.getElementById('statusFilter').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-status]');
    if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
    state.status = b.getAttribute('data-status');
    render();
  });
  teamSel.addEventListener('change', function () { state.team = this.value; render(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-export]')) A.toast('CSV export queued — we will email it over');
  });

  render();
};
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
