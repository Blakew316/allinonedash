<html lang="en">
<head>

<meta name="description" content="Daily activity and a full lessons-completed log.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

</head>
<body data-page="reports">
<a class="skip-link" href="#main">Skip to content</a>
<div id="shell"></div>
<main id="main">

<section class="wrap wrap-wide">
  <div class="page-head">
    <nav class="crumbs enter" aria-label="Breadcrumb">
      <a href="index.html">Dashboard</a><span data-icon="chevron"></span>
      <span aria-current="page">Reports</span>
    </nav>
    <div class="row-between">
      <div class="enter" style="--enter-delay:60ms">
        <h1 class="h1">Reports</h1>
        <p class="lede" style="margin-top:8px">Who is learning, what they finished, and when.</p>
      </div>
      <div class="row gap-sm toolbar-row enter" style="--enter-delay:120ms">
        <div class="field" style="gap:4px">
          <label class="tiny faint" for="startDate">Start date</label>
          <input class="input" id="startDate" type="date" value="2026-07-23" style="height:38px">
        </div>
        <div class="field" style="gap:4px">
          <label class="tiny faint" for="endDate">End date</label>
          <input class="input" id="endDate" type="date" value="2026-08-21" style="height:38px">
        </div>
        <button class="btn btn-secondary" data-export style="align-self:flex-end">Export CSV</button>
      </div>
    </div>
  </div>

  <div class="segmented enter" style="--enter-delay:180ms;margin-top:8px" id="reportTabs" role="tablist">
    <button role="tab" data-tab="activity" aria-selected="true">Daily activity</button>
    <button role="tab" data-tab="lessons" aria-selected="false">Lessons completed</button>
    <button role="tab" data-tab="courses" aria-selected="false">Course completion</button>
  </div>

  <div id="reportBody" style="margin-top:20px;padding-bottom:32px"></div>
</section>

</main>
<div id="shellFooter"></div>

<script src="assets/js/data.js"></script>
<script>
window.pageInit = function () {
  var D = window.WPI, A = window.App, esc = A.esc;
  var body = document.getElementById('reportBody');

  function summary() {
    return '<div class="grid grid-4" data-stagger="60">' +
      [['users','blue',D.stats.activeUsers,'Active reps',''],
       ['check','green',D.stats.lessonsCompleted,'Lessons completed',''],
       ['clock','navy',34,'Average minutes per rep',''],
       ['award','mint',D.stats.certRate,'Certification rate','%']
      ].map(function (s) {
        return '<div class="card" data-reveal>' +
          '<span class="tile tile-' + s[1] + '" data-icon="' + s[0] + '"></span>' +
          '<div class="stat" style="margin-top:14px">' +
            '<span class="stat-value" style="font-size:2rem" data-count="' + s[2] + '"' +
              (s[4] ? ' data-count-suffix="' + s[4] + '"' : '') + '>0</span>' +
            '<span class="stat-label">' + esc(s[3]) + '</span></div></div>';
      }).join('') + '</div>';
  }

  /* 30 days of plausible-looking daily volume, generated deterministically. */
  function daily() {
    var out = [];
    for (var i = 29; i >= 0; i--) {
      var d = new Date(2026, 7, 21 - i);
      var dow = d.getDay();
      var base = (dow === 0 || dow === 6) ? 90 : 240;
      var wobble = ((i * 37) % 61) - 30;
      out.push({ date: d, lessons: Math.max(24, base + wobble * 3), users: Math.max(9, Math.round((base + wobble * 3) / 4.2)) });
    }
    return out;
  }

  var TABS = {
    activity: function () {
      var rows = daily();
      var max = Math.max.apply(null, rows.map(function (r) { return r.lessons; }));
      var fmt = function (d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
      return summary() +
        '<div class="panel" style="margin-top:22px" data-reveal>' +
          '<div class="panel-head">' +
            '<span class="tile tile-blue" data-icon="chart"></span>' +
            '<div><div class="h4">Lessons completed per day</div>' +
            '<div class="tiny faint">23 July – 21 August 2026</div></div>' +
            '<span class="spacer"></span><span class="chip chip-green">+18% vs previous 30 days</span>' +
          '</div>' +
          '<div class="panel-body">' +
            '<div class="chart" style="height:220px">' + rows.map(function (r, i) {
              return '<div class="chart-col">' +
                  '<div class="chart-track"><div class="chart-bar" ' +
                    'data-value="' + fmt(r.date) + ' · ' + r.lessons + '" ' +
                    'data-grow="' + Math.round(r.lessons / max * 100) + '" data-grow-axis="height"></div></div>' +
                  '<span class="chart-label">' + (i % 4 === 0 ? r.date.getDate() : '&nbsp;') + '</span>' +
                '</div>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:22px" data-reveal>' +
          '<div class="panel-head"><span class="tile tile-green" data-icon="users"></span>' +
            '<div><div class="h4">Daily breakdown</div><div class="tiny faint">Most recent first</div></div></div>' +
          '<div class="table-scroll"><table class="table"><thead><tr>' +
            '<th>Date</th><th class="num">Active reps</th><th class="num">Lessons completed</th>' +
            '<th style="min-width:180px">Relative volume</th></tr></thead><tbody>' +
            rows.slice().reverse().slice(0, 14).map(function (r) {
              return '<tr><td class="strong">' + fmt(r.date) + '</td>' +
                '<td class="num numeric">' + r.users + '</td>' +
                '<td class="num numeric">' + r.lessons.toLocaleString() + '</td>' +
                '<td><div class="bar thin"><i data-grow="' + Math.round(r.lessons / max * 100) + '"></i></div></td></tr>';
            }).join('') + '</tbody></table></div>' +
        '</div>';
    },

    lessons: function () {
      var rows = [];
      for (var i = 0; i < 26; i++) {
        var p = D.people[(i * 5 + 3) % D.people.length];
        var c = D.courses[(i * 7) % D.courses.length];
        var l = c.lessons[(i * 3) % c.lessons.length];
        var hh = 9 + (i % 9), mm = (i * 17) % 60;
        rows.push({ p: p, c: c, l: l,
          time: '08/' + (21 - Math.floor(i / 6)) + '/2026 ' + hh + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM') });
      }
      return '<div class="panel" data-reveal>' +
          '<div class="panel-head"><span class="tile tile-green" data-icon="check"></span>' +
            '<div><div class="h4">Lessons completed</div>' +
            '<div class="tiny faint">5,630 records in this window · showing the 26 most recent</div></div>' +
            '<span class="spacer"></span><button class="btn btn-secondary btn-sm" data-export>Export CSV</button></div>' +
          '<div class="table-scroll"><table class="table"><thead><tr>' +
            '<th>Rep</th><th>Course</th><th>Lesson</th><th>Completed</th></tr></thead><tbody>' +
            rows.map(function (r) {
              var initials = r.p.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
              return '<tr><td><div class="row" style="gap:10px">' +
                  '<span class="avatar" style="width:28px;height:28px;font-size:.68rem;cursor:default">' + esc(initials) + '</span>' +
                  '<span class="strong">' + esc(r.p.name) + '</span></div></td>' +
                '<td><a class="small" href="course.html?c=' + r.c.slug + '">' + esc(r.c.title) + '</a></td>' +
                '<td class="small muted">' + esc(r.l.t) + '</td>' +
                '<td class="small numeric faint">' + esc(r.time) + '</td></tr>';
            }).join('') + '</tbody></table></div></div>';
    },

    courses: function () {
      var list = D.courses.slice().sort(function (a, b) { return b.completion - a.completion; });
      return '<div class="panel" data-reveal>' +
          '<div class="panel-head"><span class="tile tile-navy" data-icon="book"></span>' +
            '<div><div class="h4">Completion by course</div>' +
            '<div class="tiny faint">Share of assigned reps who finished every lesson</div></div></div>' +
          '<div class="table-scroll"><table class="table"><thead><tr>' +
            '<th>Course</th><th>Track</th><th class="num">Lessons</th><th class="num">Assigned</th>' +
            '<th style="min-width:200px">Completion</th></tr></thead><tbody>' +
            list.map(function (c) {
              return '<tr><td><a class="strong" href="course.html?c=' + c.slug + '">' + esc(c.title) + '</a></td>' +
                '<td><span class="chip">' + esc(c.track) + '</span></td>' +
                '<td class="num numeric">' + c.lessons.length + '</td>' +
                '<td class="num numeric">' + c.enrolled + '</td>' +
                '<td><div class="row gap-sm">' +
                  '<div class="bar thin" style="flex:1;min-width:90px"><i data-grow="' + c.completion + '"></i></div>' +
                  '<span class="tiny numeric strong" style="width:34px">' + c.completion + '%</span></div></td></tr>';
            }).join('') + '</tbody></table></div></div>';
    }
  };

  function show(tab) {
    body.style.opacity = '0';
    body.style.transform = 'translateY(8px)';
    setTimeout(function () {
      body.innerHTML = TABS[tab]();
      body.style.transition = 'opacity 320ms var(--ease-out), transform 320ms var(--ease-out)';
      body.style.opacity = '1';
      body.style.transform = 'none';
      A.refresh();
    }, 140);
  }

  document.getElementById('reportTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b || b.getAttribute('aria-selected') === 'true') return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
    show(b.getAttribute('data-tab'));
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-export]')) A.toast('CSV export queued — we will email it over');
  });

  body.innerHTML = TABS.activity();
};
</script>
<script src="assets/js/app.js"></script>
