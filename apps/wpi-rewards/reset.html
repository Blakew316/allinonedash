<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset — WPI Rewards</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-content: center; min-height: 100vh; margin: 0;
      background: #f5f5f7; color: #1d1d1f; text-align: center; padding: 24px; }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    p { color: #515154; max-width: 42ch; }
    #log { font-size: 0.9rem; color: #0a66ff; min-height: 1.4em; font-weight: 600; }
    a { display: inline-block; margin-top: 18px; padding: 12px 26px; border-radius: 999px;
      background: #16255f; color: #fff; text-decoration: none; font-weight: 550; }
  </style>
</head>
<body>
  <div>
    <h1>WPI Rewards — Fresh Start</h1>
    <p>This page removes every cached copy of the app from this device so the next launch loads completely fresh.</p>
    <p id="log">Cleaning up…</p>
    <a href="index.html" id="go" style="display:none">Open WPI Rewards</a>
  </div>
  <script>
    (async function () {
      const log = document.getElementById("log");
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        log.innerHTML = 'All clear <svg viewBox="0 0 24 24" width="0.95em" height="0.95em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.15em"><path d="M4.5 12.5l5 5 10-11"/></svg> — tap below to relaunch fresh.';
      } catch (e) {
        log.textContent = "Done — tap below to relaunch.";
      }
      document.getElementById("go").style.display = "inline-block";
    })();
  </script>
<!-- wpi-hub-link -->
<style>
#wpiHubLink{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:flex;align-items:center;gap:7px;padding:9px 15px 9px 11px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(0,18,94,.14);box-shadow:0 4px 16px rgba(13,20,64,.18);font:600 12.5px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;color:#00125e !important;text-decoration:none !important;-webkit-backdrop-filter:saturate(160%) blur(10px);backdrop-filter:saturate(160%) blur(10px);opacity:.94;transition:opacity .2s,box-shadow .2s,transform .2s}
#wpiHubLink:hover{opacity:1;box-shadow:0 6px 22px rgba(13,20,64,.26);transform:translateY(-1px)}
@media (max-width:760px){#wpiHubLink{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media print{#wpiHubLink{display:none}}
</style>
<a id="wpiHubLink" href="../../index.html" aria-label="Back to the hub"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00a3e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Hub</a>
</body>
</html>
