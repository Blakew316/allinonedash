<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset — WPI Rewards</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-content: center; min-height: 100vh; margin: 0;
      background: #f5f5f7; color: #1d1d1f; text-align: center; padding: 24px; }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    p { color: #515154; max-width: 42ch; }
    #log { font-size: 0.9rem; color: #0a66ff; min-height: 1.4em; font-weight: 600; }
    a { display: inline-block; margin-top: 18px; padding: 12px 26px; border-radius: 999px;
      background: #16255f; color: #fff; text-decoration: none; font-weight: 550; }
  </style>
</head>
<body>
  <div>
    <h1>WPI Rewards — Fresh Start</h1>
    <p>This page removes every cached copy of the app from this device so the next launch loads completely fresh.</p>
    <p id="log">Cleaning up…</p>
    <a href="index.html" id="go" style="display:none">Open WPI Rewards</a>
  </div>
  <script>
    (async function () {
      const log = document.getElementById("log");
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        log.textContent = "All clear ✓ — tap below to relaunch fresh.";
      } catch (e) {
        log.textContent = "Done — tap below to relaunch.";
      }
      document.getElementById("go").style.display = "inline-block";
    })();
  </script>
</body>
</html>
