  <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Kloser CRM — the field CRM for Wholesale Payments. Leads, activities, routes, booking and GPS verification in one place.">
  <!-- Standalone mode. `display: standalone` in the manifest supersedes the
       Apple switch on modern iOS; both are shipped so older versions and
       Chrome's linter are equally happy. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Home Screen label. Takes precedence over the manifest's short_name. -->
  <meta name="apple-mobile-web-app-title" content="WPI Kloser CRM">
  <!-- The only control over the standalone status bar — there is no manifest
       equivalent. `default` keeps the bar opaque with system-managed glyph
       contrast, which is the one value that cannot fail in either theme;
       js/core/pwa.js rewrites it so the NEXT cold launch matches the theme. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta property="og:title" content="Kloser CRM — Wholesale Payments">
  <meta property="og:description" content="Enterprise-grade, mobile-first CRM for Wholesale Payments field reps.">
  <meta property="og:type" content="website">

  <title>Kloser CRM — Wholesale Payments</title>

       PNG (never SVG), and composites it on an opaque layer — so these are
