<style>

  html, body { width: 512px; height: 512px; }

    display: grid; place-items: center;

  .stack {
    display: flex; flex-direction: column; align-items: center;
    gap: 26px;
    /* Optical centring: the wordmark's line box is taller than its ink, so the

  .glyph { height: 176px; width: auto; display: block; }
  .word {
    font-size: 76px; font-weight: 700; letter-spacing: .012em;
    color: #fff; line-height: 1; white-space: nowrap;
